openapi: 3.0.3
info:
  title: Books API — Lab 08
  version: 1.0.0
  description: |
    Educational API. LAB 2: ba lỗi contract cố ý đã được sửa (xem các comment "LAB 2 fix").
    The application is the reference for intended behavior.
  contact:
    name: INT3505E student
servers:
  - url: http://localhost:5000
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: books
    description: CRUD sách
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      description: Liveness check, luôn trả về status ok khi service chạy.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
  /books:
    get:
      # LAB 2 fix 1: thêm operationId còn thiếu.
      operationId: listBooks
      tags: [books]
      description: Danh sách sách, lọc theo author/year, phân trang 20 sách mỗi trang.
      parameters:
        - in: query
          name: author
          schema: {type: string}
        - in: query
          name: year
          schema: {type: integer}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: List books
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Book'}
    post:
      operationId: createBook
      tags: [books]
      description: Tạo sách mới. ISBN (nếu có) phải là duy nhất.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getBook
      tags: [books]
      description: Lấy một sách theo id.
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBook
      tags: [books]
      description: Thay thế toàn bộ sách; field tùy chọn bị bỏ trống sẽ thành null.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteBook
      tags: [books]
      description: Xoá sách. Lần đầu trả 204, lần sau trả 404.
      responses:
        '204':
          # LAB 2 fix 2: bỏ `content` — 204 No Content không có response body.
          description: Deleted (response has no body)
        '404': {$ref: '#/components/responses/NotFound'}
components:
  schemas:
    Book:
      type: object
      additionalProperties: false
      required: [id, title, author, year, isbn]
      properties:
        id: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        # LAB 2 fix 3: models.Book.year là db.Integer nullable -> integer, không phải string.
        year: {type: integer, nullable: true}
        isbn: {type: string, pattern: '^\d{13}$', nullable: true}
    BookInput:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        year: {type: integer, nullable: true, minimum: 1450, maximum: 2100}
        isbn: {type: string, pattern: '^\d{13}$', nullable: true}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    NotFound:
      description: Missing book
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Duplicate ISBN
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
