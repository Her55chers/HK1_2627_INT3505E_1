openapi: 3.0.3
info:
  title: User API — URI Path Versioning (Practice 1)
  version: 2.0.0
  description: |
    Hai version cùng tồn tại qua URI path.
    - v1: `full_name` — **deprecated**, tắt vào 2026-12-31 (xem header `Sunset`).
    - v2: `first_name` + `last_name` — breaking change so với v1 nên tách version mới.
servers:
  - url: http://localhost:5000
tags:
  - name: v1
    description: Deprecated — dùng v2
  - name: v2
    description: Version hiện hành
paths:
  /v1/users/{uid}:
    get:
      operationId: getUserV1
      tags: [v1]
      deprecated: true
      description: Lấy user theo schema v1. Mọi response kèm Sunset, Deprecation và Link tới v2.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: User (schema v1)
          headers:
            Sunset: {$ref: '#/components/headers/Sunset'}
            Deprecation: {$ref: '#/components/headers/Deprecation'}
            Link: {$ref: '#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserV1'}
        '404':
          description: Không tìm thấy user
          headers:
            Sunset: {$ref: '#/components/headers/Sunset'}
            Deprecation: {$ref: '#/components/headers/Deprecation'}
            Link: {$ref: '#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v2/users:
    post:
      operationId: createUserV2
      tags: [v2]
      description: Tạo user mới theo schema v2.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserV2Input'}
      responses:
        '201':
          description: Đã tạo
          headers:
            Location:
              description: URL của user vừa tạo
              schema: {type: string, example: /v2/users/4}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserV2'}
        '400':
          description: Body không hợp lệ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v2/users/{uid}:
    get:
      operationId: getUserV2
      tags: [v2]
      description: Lấy user theo schema v2.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: User (schema v2)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserV2'}
        '404':
          description: Không tìm thấy user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  parameters:
    Uid:
      in: path
      name: uid
      required: true
      schema: {type: integer, minimum: 1}
  headers:
    Sunset:
      description: Thời điểm v1 ngừng hoạt động (RFC 8594, HTTP-date)
      schema: {type: string, example: 'Thu, 31 Dec 2026 23:59:59 GMT'}
    Deprecation:
      description: Endpoint đã deprecated
      schema: {type: string, example: 'true'}
    Link:
      description: Version thay thế
      schema: {type: string, example: '</v2/users>; rel="successor-version"'}
  schemas:
    UserV1:
      type: object
      additionalProperties: false
      required: [id, full_name, email]
      properties:
        id: {type: integer}
        full_name: {type: string, example: Nguyen Van An}
        email: {type: string, format: email}
    UserV2:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email]
      properties:
        id: {type: integer}
        first_name: {type: string, example: An}
        last_name: {type: string, example: Nguyen}
        email: {type: string, format: email}
    UserV2Input:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: {type: string, minLength: 1}
        last_name: {type: string, minLength: 1}
        email: {type: string, format: email}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        fields:
          type: array
          items: {type: string}
