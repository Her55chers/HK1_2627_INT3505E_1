openapi: 3.1.0
info:
  title: Social Network API
  version: 1.0.0
  description: |
    Spec cho 3 endpoint xác thực và đọc bài viết.

servers:
  - url: https://api.example.com/v1
tags:
  - name: Auth
    description: Đăng nhập và làm mới token
  - name: Posts
    description: Đọc bài viết
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        Endpoint public, phải được giới hạn tần suất theo IP và theo tài khoản.

        Sai email và sai mật khẩu trả về cùng một phản hồi 401 để tránh lộ tài khoản nào tồn tại.
        Lỗi 403 chỉ xuất hiện sau khi mật khẩu đã đúng.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sai thông tin đăng nhập.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid_credentials:
                  value:
                    type: https://api.example.com/problems/invalid-credentials
                    title: Invalid credentials
                    status: 401
                    code: invalid_credentials
                    request_id: req_01J9Z7K2
        '403':
          description: Mật khẩu đúng nhưng tài khoản bị khóa hoặc chưa xác minh email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                account_suspended:
                  value:
                    type: https://api.example.com/problems/account-suspended
                    title: Account suspended
                    status: 403
                    code: account_suspended
                    request_id: req_01J9Z7K3
                email_not_verified:
                  value:
                    type: https://api.example.com/problems/email-not-verified
                    title: Email not verified
                    status: 403
                    code: email_not_verified
                    request_id: req_01J9Z7K4
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Đổi refresh token lấy cặp token mới
      description: |
        Refresh token trong body là thông tin xác thực.

        Mỗi lần gọi thành công sẽ thu hồi refresh token cũ. Nếu một token đã dùng bị gửi lại,
        toàn bộ họ token của phiên đó bị thu hồi và người dùng phải đăng nhập lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Refresh token không hợp lệ, hết hạn, đã bị thu hồi hoặc bị dùng lại.
            Mọi trường hợp đều trả cùng một `code` để không lộ trạng thái token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid_refresh_token:
                  value:
                    type: https://api.example.com/problems/invalid-refresh-token
                    title: Invalid refresh token
                    status: 401
                    code: invalid_refresh_token
                    request_id: req_01J9Z7K5
        '403':
          description: Refresh token hợp lệ nhưng tài khoản đã bị khóa sau khi token được cấp.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                account_suspended:
                  value:
                    type: https://api.example.com/problems/account-suspended
                    title: Account suspended
                    status: 403
                    code: account_suspended
                    request_id: req_01J9Z7K6
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /posts/{id}:
    get:
      operationId: getPostById
      tags: [Posts]
      summary: Lấy một bài viết theo ID
      description: |
        server còn phải kiểm tra quyền của người gọi trên từng bài.
        Bài riêng tư mà người gọi không được xem trả về 404 thay vì 403 để không lộ sự tồn tại của bài.
      security:
        - bearerAuth: ['posts:read']
      parameters:
        - name: id
          in: path
          required: true
          description: UUID của bài viết.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bài viết mà người gọi được phép xem.
          headers:
            Cache-Control:
              description: Luôn là `private` để proxy dùng chung không lưu bài viết riêng tư.
              schema:
                type: string
                const: private, max-age=0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Thiếu access token, token sai chữ ký, sai issuer hoặc audience, hoặc đã hết hạn.
          headers:
            WWW-Authenticate:
              description: 'Ví dụ: `Bearer error="invalid_token"`.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid_token:
                  value:
                    type: https://api.example.com/problems/invalid-token
                    title: Invalid access token
                    status: 401
                    code: invalid_token
                    request_id: req_01J9Z7K7
        '403':
          description: Token hợp lệ nhưng thiếu scope `posts:read`.
          headers:
            WWW-Authenticate:
              description: 'Ví dụ: `Bearer error="insufficient_scope", scope="posts:read"`.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                insufficient_scope:
                  value:
                    type: https://api.example.com/problems/insufficient-scope
                    title: Insufficient scope
                    status: 403
                    code: insufficient_scope
                    request_id: req_01J9Z7K8
        '404':
          description: Bài không tồn tại, đã xóa, hoặc người gọi không được phép xem.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                post_not_found:
                  value:
                    type: https://api.example.com/problems/post-not-found
                    title: Post not found
                    status: 404
                    code: post_not_found
                    request_id: req_01J9Z7K9
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'